<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockUp - View Product</title>
  <meta name="description" content="Compare Coles and Woolworths prices for this product on StockUp.">

  <!-- Open Graph -->
  <meta property="og:title" content="StockUp - Compare Grocery Prices">
  <meta property="og:description" content="Compare Coles and Woolworths prices side-by-side. Tap to view this product in StockUp.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://stockup.au/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://stockup.au/assets/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1B3A5C;
      --muted: #64748B;
      --white: #FFFFFF;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--primary);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
      text-decoration: none;
      color: var(--primary);
    }

    .logo img {
      border-radius: 10px;
    }

    .logo span {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 32px;
      letter-spacing: -0.01em;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E2E8F0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 32px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .store-buttons {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .store-buttons a img {
      height: 48px;
    }

    .open-app-btn {
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: var(--white);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      margin-bottom: 28px;
    }

    .hint {
      display: none;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .fallback-text {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    .fallback-text a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="/" class="logo">
    <img src="/assets/logo.png" alt="StockUp" width="48" height="48">
    <span>StockUp</span>
  </a>

  <div class="spinner"></div>

  <p class="status">Opening StockUp...</p>
  <p class="subtitle">If the app doesn't open, download it below.</p>

  <a id="open-app" class="open-app-btn" href="#">Open in StockUp</a>
  <p id="hint" class="hint"></p>

  <div class="store-buttons">
    <a id="app-store" href="https://apps.apple.com/au/app/stockup-grocery-prices/id6760887575" aria-label="Download on the App Store">
      <img src="/assets/app-store-badge.png" alt="Download on the App Store">
    </a>
    <a id="play-store" href="https://play.google.com/store/apps/details?id=com.myxcha.StockUp" aria-label="Get it on Google Play">
      <img src="/assets/google-play-badge.png" alt="Get it on Google Play">
    </a>
  </div>

  <p class="fallback-text">
    Or visit <a href="/">stockup.au</a> to learn more.
  </p>

  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var isAndroid = /Android/i.test(ua);
      // Facebook / Instagram / Messenger etc. open links in an in-app WebView,
      // which never hands the tap to Android, so verified App Links can't fire
      // and land the user here. Their WebViews also block automatic custom-
      // scheme redirects - only a real tap, or an intent:// URL, gets out.
      var inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Messenger|MicroMessenger|; wv\)/i.test(ua);

      var APP_STORE = 'https://apps.apple.com/au/app/stockup-grocery-prices/id6760887575';
      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.myxcha.StockUp';

      // /product/{id} or /product/{id}/
      var match = window.location.pathname.match(/\/product\/([^/?#]+)/);
      var productId = match ? match[1] : null;

      // Android: an intent:// URL escapes in-app WebViews far better than a bare
      // custom scheme and carries its own not-installed fallback to the store.
      // iOS has no intent scheme, so use the custom scheme (opens the app if
      // installed; the visible store badge is the manual fallback otherwise).
      var appUrl = null;
      if (productId) {
        if (isAndroid) {
          // In a normal browser, browser_fallback_url auto-forwards a
          // not-installed user to Play. In an in-app browser (Messenger etc.)
          // it is OMITTED on purpose: that WebView can auto-follow the fallback
          // when its "open external app?" prompt is left sitting, which bounced
          // installed users to the store while they read the prompt. Without it
          // there is nothing to bounce to - the prompt just waits for CONTINUE,
          // and not-installed users use the visible Play badge instead.
          appUrl = 'intent://product/' + productId +
            '#Intent;scheme=stockup;package=com.myxcha.StockUp;' +
            (inApp ? '' : 'S.browser_fallback_url=' + encodeURIComponent(PLAY_STORE) + ';') +
            'end';
        } else {
          appUrl = 'stockup://product/' + productId;
        }
      }

      // Wire the visible button - a real tap is the most reliable way out of an
      // in-app browser, so promote it and never auto-bounce those to the store.
      var btn = document.getElementById('open-app');
      if (btn && appUrl) {
        btn.href = appUrl;
        btn.style.display = 'inline-flex';
      }
      if (inApp) {
        var hint = document.getElementById('hint');
        if (hint) {
          hint.textContent =
            'Take your time - tap "Open in StockUp" above whenever you\'re ready, or use the ⋮ menu to open this page in your browser.';
          hint.style.display = 'block';
        }
      }

      // If the app opens, this page is hidden/backgrounded - track it so the
      // iOS-only fallback below never yanks a successful open to the store.
      var appOpened = false;
      function markOpened() { appOpened = true; }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) markOpened();
      });
      window.addEventListener('pagehide', markOpened);
      window.addEventListener('blur', markOpened);

      // Auto-attempt once.
      // - Android: the intent:// opens the app if installed, or follows its own
      //   browser_fallback_url to Play if not - so Android needs NO JS store
      //   timer. In an in-app browser (Messenger etc.) it raises that app's
      //   native "open external app?" prompt; there must be no timer racing it,
      //   or the page navigates out from under the prompt to the store while the
      //   user is still reading it (the exact bug this removes).
      // - iOS: the custom scheme opens the app if installed but has no native
      //   not-installed fallback, so a timed App Store bounce is kept for iOS
      //   ONLY, and only in a normal browser - and it is cancelled the moment
      //   the app actually opens (visibility/pagehide/blur above).
      if (appUrl && (isIOS || isAndroid)) {
        window.location.href = appUrl;
      }

      if (isIOS && !inApp) {
        setTimeout(function () {
          if (!appOpened) window.location.href = APP_STORE;
        }, 2500);
      }
    })();
  </script>

</body>
</html>
